/* Adjustable visual content width. */
.width-button{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;color:var(--subtle);border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:10px;white-space:nowrap}

.width-menu output{font-size:10px;color:var(--purple);font-variant-numeric:tabular-nums}
.width-menu input[type=range]{width:100%;accent-color:var(--purple-strong);cursor:pointer;margin:0;height:18px}
.width-menu p{font-size:10px;color:var(--muted);line-height:1.7;margin:10px 0 0}
.width-presets{display:flex;gap:6px;margin-top:10px}
.width-menu .width-presets button{justify-content:center;flex:1;padding:6px 8px;border:1px solid var(--line);font-size:10px}
.width-menu .width-presets button.selected{color:var(--purple);border-color:#b9afe3;background:var(--purple-wash)}
.width-menu .width-reset{margin-top:13px;padding:8px 0 0;color:var(--purple);font-size:10px;justify-content:center;border-top:1px solid var(--line);border-radius:0}

.editing-area[data-mode=visual] .prose{max-width:var(--content-width,1080px)}

/* The window defines the app height; long content scrolls inside its own pane. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;min-height:0;overflow:hidden}
.sidebar{height:100vh;height:100dvh;min-height:0;overflow:hidden}
.sidebar>.brand,.sidebar>.workspace-label,.sidebar>.new-button,.sidebar>.section-caption,.sidebar>.sidebar-bottom{flex-shrink:0}
.sidebar .document-list{min-height:0;overscroll-behavior:contain}
.history-caption{margin-top:25px;margin-bottom:9px}
.history-count{font-size:9px;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--muted)}
.main-shell{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex-shrink:0}
.workspace{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;overflow:hidden;padding-bottom:16px}
.document-heading{flex-shrink:0}

.format-toolbar,.editor-status{flex-shrink:0}
.workspace .editor-card .editing-area{flex:1;height:auto;min-height:0;min-width:0}
.preview-scroll,.source-content textarea,.outline-pane{overscroll-behavior:contain}
.source-content textarea{overflow:auto}
.outline-pane{min-height:0}
.empty-state{flex:1;min-height:0;overflow:auto;padding:clamp(20px,8vh,100px) 20px}
.focus-mode .workspace{padding-bottom:14px}
.width-menu{max-height:calc(100dvh - 110px);overflow-y:auto;overscroll-behavior:contain}

    if (relativeImagePath(url)) return stash(`<img data-image-path="${escapeHTML(url)}" data-image-alt="${plainAlt}" alt="${plainAlt}" contenteditable="false" loading="lazy" />`);
    return stash(plainAlt);
  });
  text = text.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, (_, label, url) => {
    const valid = url.includes('\u0000') ? '' : safeURL(url.replace(/&amp;/g, '&'));
    return stash(valid ? `<a href="${escapeHTML(valid)}" rel="noopener noreferrer">${label}</a>` : label);
  });
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');

}

const tableCells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(s => s.trim().replace(/\\\|/g, '|'));
const isTableDivider = line => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line || '');
const isList = line => /^(\s*)([-+*]|\d+\.)\s+(.*)$/.exec(line);

function renderMarkdown(markdown) {
  const lines = String(markdown).replace(/\r\n?/g, '\n').split('\n');
  let i = 0;
  const html = [];
  const special = (line, next) => /^\s*(```|~~~|#{1,6}\s|>|<!-- moye-table:|([-*_])(?:\s*\2){2,}\s*$)/.test(line) || isList(line) || isTableDivider(next);
  function list(baseIndent) {
    let output = '';
    const first = isList(lines[i]);
    const ordered = /\d/.test(first[2]);
    const tag = ordered ? 'ol' : 'ul';
    const start = ordered ? Number(first[2].slice(0, -1)) : 1;
    output += `<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>`;
    while (i < lines.length) {
      const m = isList(lines[i]);
      if (!m || m[1].length !== baseIndent || /\d/.test(m[2]) !== ordered) break;
      let content = m[3];
      const task = /^\[([ xX])\]\s?(.*)$/.exec(content);
      output += task ? `<li class="task-item"><input type="checkbox" contenteditable="false" aria-label="任务状态" ${task[1] !== ' ' ? 'checked' : ''}><span>${inline(task[2])}</span>` : `<li>${inline(content)}`;
      i++;
      while (i < lines.length) {
        const nested = isList(lines[i]);
        if (nested && nested[1].length > baseIndent) output += list(nested[1].length);
        else if (lines[i].trim() && !nested && lines[i].match(/^\s+/)?.[0].length > baseIndent) output += `<br>${inline(lines[i++].trim())}`;
        else break;
      }
      output += '</li>';
    }
    return output + `</${tag}>`;
  }
  while (i < lines.length) {
    let line = lines[i];
    let tableLayout = null;
    const metadata = /^\s*<!-- moye-table: (.*?) -->\s*$/.exec(line);
    if (metadata && isTableDivider(lines[i + 2])) {
      tableLayout = parseTableLayout(metadata[1], tableCells(lines[i + 1]).length);
      if (tableLayout) line = lines[++i];
    }
    if (!line.trim()) { i++; continue; }
    const fence = /^\s*(`{3,}|~{3,})([^\s]*)\s*$/.exec(line);
    if (fence) {
      i++;
      const code = [];
      while (i < lines.length && !(lines[i].trim().startsWith(fence[1][0].repeat(fence[1].length)))) code.push(lines[i++]);
      if (i < lines.length) i++;

      continue;
    }

    if (heading) { html.push(`<h${heading[1].length}>${inline(heading[2].replace(/\s+#+\s*$/, ''))}</h${heading[1].length}>`); i++; continue; }

      const quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*> ?/, ''));
      html.push(`<blockquote>${renderMarkdown(quote.join('\n'))}</blockquote>`); continue;
    }
    if (isTableDivider(lines[i + 1])) {
      const header = tableCells(lines[i]);
      const aligns = tableCells(lines[i + 1]).map(s => s.startsWith(':') && s.endsWith(':') ? 'center' : s.endsWith(':') ? 'right' : 'left');
      const layoutAttributes = tableLayout ? ` data-table-layout="${escapeHTML(JSON.stringify(tableLayout))}" style="width:${tableLayout.width}%;${tableLayout.columns.length ? 'table-layout:fixed;' : ''}"` : '';
      const columnGroup = tableLayout?.columns.length ? '<colgroup>' + tableLayout.columns.map(width => `<col style="width:${width}%">`).join('') + '</colgroup>' : '';
      html.push(`<table${layoutAttributes}>${columnGroup}<thead><tr>` + header.map((s, n) => `<th style="text-align:${aligns[n]}">${inline(s)}</th>`).join('') + '</tr></thead><tbody>');
      i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
        const cells = tableCells(lines[i++]);
        html.push('<tr>' + header.map((_, n) => `<td style="text-align:${aligns[n]}">${inline(cells[n] || '')}</td>`).join('') + '</tr>');
      }
      html.push('</tbody></table>'); continue;
    }
    if (isList(line)) { html.push(list(isList(line)[1].length)); continue; }
    const paragraph = [inline(lines[i++])];
    while (i < lines.length && lines[i].trim() && !special(lines[i], lines[i + 1])) paragraph.push(inline(lines[i++]));

  }
  return html.join('\n') || '<p><br></p>';
}

function inlineMarkdown(node) {

  const tag = node.tagName.toLowerCase();
  const children = () => [...node.childNodes].map(inlineMarkdown).join('');
  const withTextStyle = value => {
    const color = safeTextColor(node.style?.color || (tag === 'font' ? node.getAttribute('color') : ''));
    return color ? `<span style="color: ${color};">${value}</span>` : value;
  };

  if (tag === 'br') return '\n';
  if (tag === 'strong' || tag === 'b') return withTextStyle(`**${children()}**`);
  if (tag === 'em' || tag === 'i') return withTextStyle(`*${children()}*`);
  if (tag === 's' || tag === 'strike' || tag === 'del') return withTextStyle(`~~${children()}~~`);
  if (tag === 'code') {
    const content = node.textContent;
    const fence = '`'.repeat(Math.max(0, ...[...content.matchAll(/`+/g)].map(m => m[0].length)) + 1);
    const padding = content.startsWith('`') || content.endsWith('`') || (content.startsWith(' ') && content.endsWith(' ')) ? ' ' : '';
    return fence + padding + content + padding + fence;
  }
  if (tag === 'a') return withTextStyle(`[${children()}](${safeURL(node.getAttribute('href'))})`);
  if (tag === 'img') {
    const local = node.getAttribute('data-image-path');
    const path = relativeImagePath(local) ? local : safeURL(node.getAttribute('src'));
    const alt = (local ? node.getAttribute('data-image-alt') ?? node.getAttribute('alt') : node.getAttribute('alt')) || '';
    return `![${alt.replace(/[\\\[\]]/g, '\\$&')}](${/[\s()]/.test(path) ? '<' + path + '>' : path})`;
  }

}

function blockMarkdown(node, depth = 0) {
  if (node.nodeType === 3) return node.textContent.trim() ? inlineMarkdown(node) : '';
  if (node.nodeType !== 1) return '';
  const tag = node.tagName.toLowerCase();
  if (/^h[1-6]$/.test(tag)) return '#'.repeat(Number(tag[1])) + ' ' + inlineMarkdown(node);
  if (tag === 'hr') return '---';
  if (tag === 'pre') {
    const content = (node.querySelector('code') || node).textContent.replace(/\n$/, '');
    const longest = Math.max(2, ...[...content.matchAll(/`+/g)].map(m => m[0].length));
    const fence = '`'.repeat(longest + 1);
    return `${fence}${node.dataset.language || ''}\n${content}\n${fence}`;
  }
  if (tag === 'blockquote') return serializeMarkdown(node).trimEnd().split('\n').map(s => '> ' + s).join('\n');
  if (tag === 'ul' || tag === 'ol') {
    return [...node.children].filter(n => n.tagName === 'LI').map((li, index) => {
      const nested = [...li.children].filter(n => ['UL', 'OL'].includes(n.tagName));
      const checkbox = li.querySelector(':scope > input[type=checkbox]');
      const content = [...li.childNodes].filter(n => !nested.includes(n)).map(inlineMarkdown).join('').trim();
      const prefix = tag === 'ol' ? `${Number(node.getAttribute('start') || 1) + index}. ` : '- ';
      return '  '.repeat(depth) + prefix + (checkbox ? `[${checkbox.checked ? 'x' : ' '}] ` : '') + content + nested.map(n => '\n' + blockMarkdown(n, depth + 1)).join('');
    }).join('\n');
  }
  if (tag === 'table') {
    const rows = [...node.querySelectorAll('tr')].map(row => [...row.children].map(cell => inlineMarkdown(cell).replace(/\|/g, '\\|').replace(/\n/g, ' ')));
    if (!rows.length) return '';
    const row = values => '| ' + values.join(' | ') + ' |';
    const headerCells = [...node.querySelector('tr').children];
    const dividers = headerCells.map(cell => cell.style.textAlign === 'center' ? ':---:' : cell.style.textAlign === 'right' ? '---:' : '---');
    const layout = parseTableLayout(node.dataset.tableLayout, headerCells.length);
    const metadata = layout ? `<!-- moye-table: ${JSON.stringify(layout)} -->\n` : '';
    return metadata + [row(rows[0]), row(dividers), ...rows.slice(1).map(row)].join('\n');
  }
  if (tag === 'div' && [...node.children].some(n => /^(DIV|P|H[1-6]|UL|OL|TABLE|PRE|BLOCKQUOTE)$/.test(n.tagName))) return serializeMarkdown(node);
  return inlineMarkdown(node);
}

function serializeMarkdown(element) {
  return [...element.childNodes].map(node => blockMarkdown(node)).filter(Boolean).join('\n\n').trim() + '\n';
}

const HISTORY_LIMIT = 20;

const historyTime = doc => Math.max(
  Number.isFinite(doc.lastOpened) ? doc.lastOpened : 0,
  Number.isFinite(doc.updated) ? doc.updated : 0,
);

function recentDocuments(records, preserve = () => false) {
  const seen = new Set();
  const ordered = records.filter(doc => {
    if (!doc || doc.trashed || typeof doc.id !== 'string' || typeof doc.title !== 'string' || typeof doc.markdown !== 'string' || seen.has(doc.id)) return false;
    seen.add(doc.id);
    return true;
  }).sort((a, b) => historyTime(b) - historyTime(a) || (a.id < b.id ? -1 : 1));
  return [...ordered.slice(0, HISTORY_LIMIT), ...ordered.slice(HISTORY_LIMIT).filter(preserve)];
}

function migrateHistory(records) {
  const samples = initialDocuments();
  const normalize = value => value.replace(/\r\n?/g, '\n').trim();
  return recentDocuments(records.filter(doc => !samples.some(sample =>
    doc?.id === sample.id && doc.title === sample.title && typeof doc.markdown === 'string' && normalize(doc.markdown) === normalize(sample.markdown)
  )));
}


const HISTORY_STORAGE_PREFIX = 'inkwell.history.v2:';
const PAGE_DRAFT_STORAGE_KEY = 'inkwell.page-drafts.v1';
const contentFields = ['markdown', 'fileDirty', 'fileDiskContent', 'updated'];
const validRecord = doc => doc && typeof doc.id === 'string' && typeof doc.title === 'string' && typeof doc.markdown === 'string';

function restorePageDrafts(storage, records) {
  const drafts = JSON.parse(storage.getItem(PAGE_DRAFT_STORAGE_KEY) || '[]');
  const combined = new Map(records.map(doc => [doc.id, doc]));
  if (Array.isArray(drafts)) {
    for (const doc of drafts) {
      if (!validRecord(doc) || !doc.fileDirty) continue;
      const remote = combined.get(doc.id);
      // A backup from before an acknowledged save is no longer an unsaved
      // draft. Do not resurrect its dirty flag after reloading the page.
      if (remote && !remote.fileDirty && remote.markdown === doc.markdown) continue;
      if (typeof doc.fileDiskContent === 'string' && doc.markdown === doc.fileDiskContent.replace(/^\uFEFF/, '')) continue;
      combined.set(doc.id, doc);
    }
  }
  return [...combined.values()];
}

// Apply only this page's changes. Merely reopening an old cached document must
// not replace a newer draft or title published by another page.
function mergeHistoryRecord(local, remote, baseline) {
  if (!remote || !baseline) return { ...local };
  const merged = { ...remote };
  const changed = key => JSON.stringify(local[key]) !== JSON.stringify(baseline[key]);
  for (const key of new Set([...Object.keys(local), ...Object.keys(baseline)])) {
    if (contentFields.includes(key) || key === 'lastOpened' || !changed(key)) continue;
    if (key in local) merged[key] = local[key];
    else delete merged[key];
  }
  if (contentFields.some(changed)) {
    for (const key of contentFields) {
      if (key in local) merged[key] = local[key];
      else delete merged[key];
    }
  }
  const opened = Math.max(Number(local.lastOpened) || 0, Number(remote.lastOpened) || 0);
  if (opened) merged.lastOpened = opened;
  return merged;
}

class SharedHistoryStore {

    this.client = globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2);
  }

  key(kind, id = '') { return HISTORY_STORAGE_PREFIX + kind + (id ? ':' + encodeURIComponent(id) : ''); }
  isDeleted(id) { return this.storage.getItem(this.key('deleted', id)) !== null; }
  remember(doc) { this.baselines.set(doc.id, JSON.stringify(doc)); }
  hasLocalChanges(doc) { return this.baselines.get(doc.id) !== JSON.stringify(doc); }
  ownsDraft(doc) {
    if (this.localDrafts.has(doc.id)) return true;
    const previous = this.baselines.get(doc.id);
    if (!previous) return !!doc.fileDirty;
    const baseline = JSON.parse(previous);
    return !!doc.fileDirty && contentFields.some(key => JSON.stringify(doc[key]) !== JSON.stringify(baseline[key]));
  }
  signal() {
    this.storage.setItem(this.key('changed'), `${this.client}:${++this.sequence}`);
  }
  hasChanges() { return this.storage.getItem(this.key('changed')) !== this.lastSignal; }

  initialize(legacyRecords) {
    let wrote = false;
    // During an upgrade, different old pages may unload different legacy
    // snapshots. Import only missing records, always respecting tombstones.
    for (const doc of recentDocuments(legacyRecords)) {
      const key = this.key('record', doc.id);
      if (!this.isDeleted(doc.id) && this.storage.getItem(key) === null) {
        this.storage.setItem(key, JSON.stringify(doc));
        wrote = true;
      }
    }
    if (this.storage.getItem(this.key('ready')) === null) {
      this.storage.setItem(this.key('ready'), '1');
      wrote = true;
    }
    if (wrote) this.signal();
    const records = this.read();
    records.forEach(doc => this.remember(doc));
    return records;
  }

  allRecords() {
    const keys = [];
    for (let index = 0; index < this.storage.length; index++) {
      const key = this.storage.key(index);
      if (key?.startsWith(this.key('record') + ':')) keys.push(key);
    }
    return keys.flatMap(key => {
      let doc;
      try { doc = JSON.parse(this.storage.getItem(key)); } catch { return []; }
      return validRecord(doc) && key === this.key('record', doc.id) && !this.isDeleted(doc.id) ? [doc] : [];
    });
  }

  read() {
    // Capture the signal before reading so a write arriving mid-read is picked
    // up again by the fallback poll even if a storage event was missed.
    this.lastSignal = this.storage.getItem(this.key('changed'));
    return recentDocuments(this.allRecords());
  }

  publish(localRecords) {
    let wrote = false;
    for (const local of localRecords) {
      if (!validRecord(local)) continue;
      const encoded = JSON.stringify(local);
      if (this.ownsDraft(local)) this.localDrafts.add(local.id);
      if (!local.fileDirty) this.localDrafts.delete(local.id);
      const previous = this.baselines.get(local.id);
      if (previous === encoded || this.isDeleted(local.id)) continue;
      const key = this.key('record', local.id);
      let remote;
      try { remote = JSON.parse(this.storage.getItem(key)); } catch { /* Replace only a malformed record. */ }
      const next = mergeHistoryRecord(local, validRecord(remote) ? remote : null, previous ? JSON.parse(previous) : null);
      this.storage.setItem(key, JSON.stringify(next));
      this.baselines.set(local.id, encoded);
      wrote = true;
    }
    const all = this.allRecords();
    const keep = new Set(recentDocuments(all).map(doc => doc.id));
    for (const doc of all) {
      if (keep.has(doc.id)) continue;
      // Evicted entries need tombstones too, or an idle page could bring them
      // back and repeatedly displace newer history entries.
      this.storage.setItem(this.key('deleted', doc.id), '1');
      this.storage.removeItem(this.key('record', doc.id));
      wrote = true;
    }
    if (wrote) this.signal();
    return this.read();
  }

  delete(id) {
    // The separate durable marker wins even over a simultaneous stale write
    // to this record's key. It is never cleared by merging or polling.
    this.storage.setItem(this.key('deleted', id), '1');
    this.storage.removeItem(this.key('record', id));
    this.signal();
  }
}


async function copyCodeText(text, environment = globalThis) {
  try {
    if (environment.navigator?.clipboard?.writeText) {
      await environment.navigator.clipboard.writeText(text);
      return;
    }
  } catch { /* Local HTML pages can fall back to the browser's copy command. */ }
  const doc = environment.document;
  const active = doc.activeElement;
  const selection = environment.getSelection?.();
  const ranges = selection ? Array.from({ length: selection.rangeCount }, (_, index) => selection.getRangeAt(index).cloneRange()) : [];
  const inputSelection = typeof active?.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd, active.selectionDirection] : null;
  const textarea = doc.createElement('textarea');
  textarea.value = text;
  textarea.readOnly = true;
  textarea.setAttribute('aria-label', '复制代码临时区域');
  textarea.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
  doc.body.append(textarea);
  try {
    textarea.select();
    if (!doc.execCommand('copy')) throw new Error('复制失败，请允许浏览器访问剪贴板后重试');
  } finally {
    textarea.remove();
    active?.focus({ preventScroll: true });
    if (inputSelection) active.setSelectionRange(...inputSelection);
    if (selection) {
      selection.removeAllRanges();
      ranges.forEach(range => selection.addRange(range));
    }
  }
}

function refreshCodeCopyButtons(editor, notify, copy = copyCodeText) {
  for (const pre of editor.querySelectorAll('pre')) {
    if (!pre.querySelector('code') || pre.querySelector('[data-copy-code]')) continue;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'code-copy-button';
    button.contentEditable = 'false';
    button.dataset.copyCode = '';
    button.title = '复制代码';
    button.setAttribute('aria-label', '复制代码块内容');
    button.innerHTML = icon('copy', 15);
    button.addEventListener('pointerdown', event => event.preventDefault());
    button.addEventListener('click', async event => {
      event.preventDefault(); event.stopPropagation();
      if (button.disabled) return;
      // Read at click time so edits made after rendering are included exactly,
      // without Markdown fences, language labels, or the button's UI text.
      const code = pre.querySelector('code');
      if (!code) { notify('代码块内容已变化，请重新打开文档后重试'); return; }
      button.disabled = true;
      try {
        await copy(code.textContent);
        button.innerHTML = icon('check', 15);
        button.title = '已复制';
        button.setAttribute('aria-label', '已复制代码块内容');
        notify('代码已复制');
      } catch (error) { notify(error.message || '复制失败，请重试'); }
      finally {
        button.disabled = false;
        setTimeout(() => {
          button.innerHTML = icon('copy', 15);
          button.title = '复制代码';
          button.setAttribute('aria-label', '复制代码块内容');
        }, 1500);
      }
    });
    pre.prepend(button);
  }
}

function activeOutlineIndex(positions, scrollTop, viewportHeight, contentHeight, threshold = 24) {
  if (!positions.length) return -1;
  if (scrollTop > 0 && contentHeight > viewportHeight && scrollTop + viewportHeight >= contentHeight - 2) return positions.length - 1;
  let active = 0;
  for (let index = 0; index < positions.length; index++) {
    if (positions[index] <= threshold) active = index;
    else break;
  }
  return active;
}

function installOutlineTracking({ editor, scroll, list, pane, enabled }) {
  let frame = null;

  function select(index) {
    const buttons = [...list.querySelectorAll('[data-outline]')];
    for (const button of buttons) {
      const current = Number(button.dataset.outline) === index;
      button.classList.toggle('current', current);
      if (current) button.setAttribute('aria-current', 'location');
      else button.removeAttribute('aria-current');
      if (!current || !pane.clientHeight) continue;
      const bounds = pane.getBoundingClientRect();
      const rect = button.getBoundingClientRect();
      // Scroll only the outline pane; never move the document being read.
      if (rect.top < bounds.top + 8) pane.scrollTop += rect.top - bounds.top - 8;
      else if (rect.bottom > bounds.bottom - 8) pane.scrollTop += rect.bottom - bounds.bottom + 8;
    }
  }

  function update() {
    if (!enabled() || !scroll.clientHeight) return;
    const top = scroll.getBoundingClientRect().top + (scroll.clientTop || 0);
    const positions = [...editor.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(heading => heading.getBoundingClientRect().top - top);
    select(activeOutlineIndex(positions, scroll.scrollTop, scroll.clientHeight, scroll.scrollHeight));
  }

  function schedule() {
    if (frame !== null) return;
    frame = requestAnimationFrame(() => { frame = null; update(); });
  }

  scroll.addEventListener('scroll', schedule, { passive: true });
  // Image loading, resizing, fullscreen and font changes can all move a heading
  // without a scroll event. Recalculate against the actual rendered geometry.
  editor.addEventListener('load', schedule, true);
  window.addEventListener('resize', schedule);
  const resize = new ResizeObserver(schedule);
  resize.observe(editor); resize.observe(scroll);
  new MutationObserver(schedule).observe(editor, { childList: true, subtree: true, characterData: true });
  return { refresh: schedule, select };
}

// Only text inserted by typing (or a completed IME composition) triggers rules.
function markdownInputRule(text) {
  const block = /^(#{1,3}|[-*]|1\.|>) $/.exec(text);
  if (block) {
    const marker = block[1];
    return { type: 'block', tag: marker[0] === '#' ? `h${marker.length}` : marker === '>' ? 'blockquote' : marker === '1.' ? 'ol' : 'ul', length: text.length };
  }
  // Require a closing pair at the caret, nonempty content and unescaped markers.
  for (const [pattern, tag, delimiter] of [[/\*\*([^*\n]+)\*\*$/, 'strong', '**'], [/`([^`\n]+)`$/, 'code', '`']]) {
    const match = pattern.exec(text);
    if (!match || !match[1].trim() || /^\s|\s$/.test(match[1])) continue;
    const start = match.index;
    if (text[start - 1] === delimiter[0]) continue;
    const slashes = /\\+$/.exec(text.slice(0, start))?.[0].length || 0;
    if (slashes % 2) continue;
    if (tag === 'strong' && (text.slice(0, start).match(/(?<!\\)`/g)?.length || 0) % 2) continue;
    return { type: 'inline', tag, start, end: text.length, delimiter: delimiter.length };
  }
  return null;
}

function applyVisualInputRule(editor, before = () => {}) {
  const doc = editor.ownerDocument;
  const selection = doc.defaultView.getSelection();
  if (!selection?.rangeCount || !selection.isCollapsed) return false;
  const caret = selection.getRangeAt(0);
  if (!editor.contains(caret.startContainer)) return false;
  const element = caret.startContainer.nodeType === 1 ? caret.startContainer : caret.startContainer.parentElement;
  if (element.closest('pre,code,a,[contenteditable="false"]')) return false;
  const block = element.closest('p,div,h1,h2,h3,h4,h5,h6,li,td,th,blockquote');
  // A bare editor has no paragraph until the first Enter; use it as the block.
  const container = block && editor.contains(block) ? block : editor;
  const nodes = [];
  let text = '', offset = null;
  const boundary = /^(BR|P|DIV|H[1-6]|LI|UL|OL|TD|TH|BLOCKQUOTE|PRE|CODE|A|IMG|INPUT)$/;
  function visit(node) {
    if (node.nodeType === 3) {
      const start = text.length;
      nodes.push({ node, start, end: start + node.textContent.length });
      if (node === caret.startContainer) offset = start + caret.startOffset;
      text += node.textContent;
      return;
    }
    if (node.nodeType !== 1) return;
    if (node !== container && (boundary.test(node.tagName) || node.getAttribute('contenteditable') === 'false')) {
      text += '\n'; return;
    }
    for (let i = 0; i <= node.childNodes.length; i++) {
      if (node === caret.startContainer && caret.startOffset === i) offset = text.length;
      if (i < node.childNodes.length) visit(node.childNodes[i]);
    }
  }
  visit(container);
  if (offset === null) return false;
  const prefix = text.slice(0, offset).replace(/\u00a0/g, ' ');
  const rule = markdownInputRule(prefix);
  if (!rule) return false;
  if (rule.type === 'block' && (container !== editor && !['P', 'DIV'].includes(container.tagName))) return false;
  // Never replace a root which also contains other blocks.
  if (rule.type === 'block' && container.querySelector('p,div,h1,h2,h3,h4,h5,h6,ul,ol,li,blockquote,pre,table')) return false;
  const point = (at, end = false) => {
    const entry = (end ? [...nodes].reverse() : nodes).find(item => at >= item.start && at <= item.end);
    return entry ? [entry.node, at - entry.start] : [container, 0];
  };
  const range = (start, end) => {
    const result = doc.createRange(); result.setStart(...point(start)); result.setEnd(...point(end, true)); return result;
  };
  before();
  let destination;
  if (rule.type === 'block') {
    range(0, rule.length).deleteContents();
    const replacement = doc.createElement(rule.tag);
    let content = replacement;
    if (rule.tag === 'ul' || rule.tag === 'ol') { content = doc.createElement('li'); replacement.append(content); }
    else if (rule.tag === 'blockquote') { content = doc.createElement('p'); replacement.append(content); }
    while (container.firstChild) content.append(container.firstChild);
    if (!content.textContent && !content.querySelector('br,img,input')) content.append(doc.createElement('br'));
    if (container === editor) editor.append(replacement);
    else container.replaceWith(replacement);
    destination = doc.createRange(); destination.setStart(content, 0);
  } else {
    // Work backwards so deleting the closing delimiter doesn't shift the body.
    const closing = range(rule.end - rule.delimiter, rule.end);
    const bodyRange = range(rule.start + rule.delimiter, rule.end - rule.delimiter);
    const opening = range(rule.start, rule.start + rule.delimiter);
    closing.deleteContents();
    const body = bodyRange.extractContents();
    opening.deleteContents();
    const replacement = doc.createElement(rule.tag); replacement.append(body);
    opening.insertNode(replacement);
    destination = doc.createRange(); destination.setStartAfter(replacement);
  }
  destination.collapse(true);
  selection.removeAllRanges(); selection.addRange(destination);
  return true;
}

function installMarkdownInputRules({ editor, enabled, before, commit, plain }) {
  let composing = false;
  let compositionPending = false;
  let pastePending = false;
  function transform() {
    if (!enabled()) return false;
    if (!applyVisualInputRule(editor, before)) return false;
    commit(); return true;
  }
  editor.addEventListener('compositionstart', () => { composing = true; });
  editor.addEventListener('compositionend', () => {
    composing = false; compositionPending = true;
    // Browsers differ on whether the final input comes before or after compositionend.
    queueMicrotask(() => {
      if (!compositionPending) return;
      compositionPending = false;
      if (!transform()) plain();
    });
  });
  editor.addEventListener('paste', () => {
    pastePending = true;
    queueMicrotask(() => { pastePending = false; });
  }, true);
  editor.addEventListener('input', event => {
    if (composing || event.isComposing) return;
    if (compositionPending) return; // The microtask commits the final IME text once.
    const typed = event.inputType === 'insertText' || event.inputType === 'insertCompositionText';
    if (pastePending || !typed || !transform()) plain();
  });
}

function resolveReadingStyle(id, legacyDark = false) {
  return READING_STYLES.find(style => style.id === id)
    || READING_STYLES.find(style => style.id === (legacyDark ? 'midnight' : 'default'));
}

function applyReadingStyle(root, id) {
  const style = resolveReadingStyle(id);
  root.dataset.style = style.id;
  root.dataset.theme = style.dark ? 'dark' : 'light';
  root.style.colorScheme = style.dark ? 'dark' : 'light';
  for (const [token, value] of Object.entries(style.tokens)) root.style.setProperty(`--${token}`, value);
  return style;
}

// File-handle adapter for files explicitly opened by the local moye command.
class LocalFileHandle {
  constructor(descriptor, request = (...args) => fetch(...args)) {
    this.type = 'moye-local-file';
    this.id = descriptor.id;
    this.token = descriptor.token;
    this.name = descriptor.name;
    this.path = descriptor.path;
    this.request = request;
  }

  toStoredHandle() { return { type: this.type, id: this.id, token: this.token, name: this.name, path: this.path }; }
  async queryPermission() { return 'granted'; }
  async requestPermission() { return 'granted'; }
  async isSameEntry(other) { return other?.type === this.type && other.path === this.path; }

  async call(method = 'GET', body) {
    let response;
    try {
      response = await this.request('/__moye/file', {
        method, cache: 'no-store', credentials: 'omit',
        headers: { 'X-Moye-File': this.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
    } catch { throw new Error('本地墨页服务未连接，请在终端重新运行 moye 打开此文件'); }
    const data = await response.json();
    if (!response.ok) {
      const error = new Error(data.error || '原文件读取或写入失败');
      if (response.status === 404 && data.code === 'FILE_NOT_FOUND') error.code = 'FILE_NOT_FOUND';
      if (response.status === 409) { error.code = 'EXTERNAL_MODIFICATION'; error.externalContent = data.content; }

    }

  }

  async getFile() {
    const file = await this.call();

    return { name: file.name, size: file.size, lastModified: file.modified, text: async () => file.content };
  }

  async writeIfUnchanged(expectedContent, content) { await this.call('PUT', { expectedContent, content }); }
}

class OriginalFileWriter {
  constructor(handle, diskContent) {
    this.handle = handle;
    this.diskContent = diskContent;
    this.bom = diskContent.startsWith('\uFEFF') ? '\uFEFF' : '';
    this.pending = Promise.resolve();
  }

  save(content) {
    const operation = this.pending.catch(() => {}).then(async () => {
      if (await this.handle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
        throw new Error('文件写入授权已失效，请点击保存状态重新授权');
      }
      const next = this.bom + content.replace(/^\uFEFF/, '');
      if (this.handle.writeIfUnchanged) {
        await this.handle.writeIfUnchanged(this.diskContent, next);
        this.diskContent = next;
        return content;
      }
      const latest = await this.handle.getFile();
      const latestContent = await latest.text();
      if (latestContent !== this.diskContent) {
        const error = new Error('原文件已被其他程序修改，已停止写入；请点击保存状态核对冲突');
        error.code = 'EXTERNAL_MODIFICATION';
        error.externalContent = latestContent;
        throw error;
      }
      const writable = await this.handle.createWritable();
      try {
        await writable.write(next);
        await writable.close();
      } catch (error) {
        try { await writable.abort(); } catch {}
        throw error;
      }
      // Success means the stream has closed and the browser committed the file.
      this.diskContent = next;
      return content;
    });
    this.pending = operation;
    return operation;
  }

  async inspectExternal() {
    if (await this.handle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
      throw new Error('文件授权已失效，无法检测外部修改；请点击保存状态重新授权');
    }
    const file = await this.handle.getFile();
    if (file.size > 2 * 1024 * 1024) throw new Error('原文件超过 2 MB，已暂停自动刷新');
    const content = await file.text();
    return { content, modified: file.lastModified };
  }
}

let handleDatabase;
function database() {
  if (!handleDatabase) handleDatabase = new Promise((resolve, reject) => {
    const request = indexedDB.open('inkwell.original-files', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('handles');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return handleDatabase;
}

async function rememberFileHandle(id, handle) {
  const db = await database();
  await new Promise((resolve, reject) => {
    const transaction = db.transaction('handles', 'readwrite');
    transaction.objectStore('handles').put(handle.toStoredHandle?.() || handle, id);
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

async function recallFileHandle(id) {
  const db = await database();
  return new Promise((resolve, reject) => {
    const request = db.transaction('handles', 'readonly').objectStore('handles').get(id);
    request.onsuccess = () => resolve(request.result?.type === 'moye-local-file' ? new LocalFileHandle(request.result) : request.result || null);
    request.onerror = () => reject(request.error);
  });
}

async function forgetFileHandle(id) {
  const db = await database();
  await new Promise((resolve, reject) => {
    const transaction = db.transaction('handles', 'readwrite');
    transaction.objectStore('handles').delete(id);
    transaction.objectStore('handles').delete(`@image-directory:${id}`);
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}


function installTableTools({ editor, canEdit, begin, commit, busy }) {
  const panel = document.createElement('div');

  handle.addEventListener('pointercancel', cancel);
  handle.addEventListener('lostpointercapture', cancel);
  window.addEventListener('blur', cancel);

  scroll.addEventListener('scroll', schedulePosition);
  window.addEventListener('resize', schedulePosition);
  new ResizeObserver(schedulePosition).observe(scroll);
  new MutationObserver(schedulePosition).observe(editor, { childList: true, subtree: true });

}


function localImageErrorMessage(status, detail) {
  if (status === 403 && detail === '无效的服务凭据') return '后台服务版本较旧；请先保存文档，再运行 moye --stop 并重新用 moye 打开文件';
  if (status === 404) return '图片文件不存在，请检查图片是否位于文档所在目录';
  return detail || '图片内容无法解码，请确认图片文件完整';
}

function refreshLocalImages(editor, handle, request = (...args) => fetch(...args)) {
  for (const image of editor.querySelectorAll('img[data-image-path]')) {
    const path = image.getAttribute('data-image-path');
    const url = handle?.type === 'moye-local-file' ? localImageURL(handle.token, path) : '';
    const originalAlt = image.getAttribute('data-image-alt') || '';
    const failImage = message => {
      image.classList.add('local-image-error');
      image.alt = message + '：' + path;
      image.title = message + '：' + path;
    };
    if (!url) {
      image.removeAttribute('src');
      failImage('请通过 moye 命令打开文档以加载本地图片');
      continue;
    }
    if (image.getAttribute('src') === url) continue;
    image.classList.remove('local-image-error'); image.alt = originalAlt; image.title = path;
    let errorVersion = 0;
    image.onload = () => { errorVersion++; image.classList.remove('local-image-error'); image.alt = originalAlt; image.title = path; };
    image.onerror = async () => {
      const version = ++errorVersion;
      failImage('图片加载失败，正在检查原因');
      let reason;
      try {
        const response = await request(url, { cache: 'no-store', credentials: 'omit', signal: AbortSignal.timeout(5000) });
        const data = response.ok ? null : await response.json();
        reason = localImageErrorMessage(response.status, data?.error);
      } catch { reason = '本地服务未连接，请在终端重新运行 moye 打开文件'; }
      if (image.getAttribute('src') === url && version === errorVersion) failImage(reason);
    };
    image.referrerPolicy = 'no-referrer';
    image.setAttribute('src', url);
  }
}

async function validateImageDirectory(directory, fileHandle) {
  if (!fileHandle || fileHandle.type === 'moye-local-file') throw new Error('请先通过「打开文档」选择原始 Markdown 文件');
  let candidate;
  try { candidate = await directory.getFileHandle(fileHandle.name); }
  catch (error) {
    if (error.name === 'NotFoundError' || error.name === 'TypeMismatchError') throw new Error('请选择当前 Markdown 文件所在的文件夹，而不是图片子目录');
    throw error;
  }
  if (!await candidate.isSameEntry(fileHandle)) throw new Error('所选目录中的同名文件不是当前文档，请选择当前 Markdown 所在的文件夹');
}

async function readDirectoryImage(directory, path) {
  const safePath = relativeImagePath(path);
  if (!safePath) throw new Error('图片路径无效，仅支持目录内的相对路径图片');
  const parts = safePath.split('/');
  let parent = directory;
  for (const part of parts.slice(0, -1)) parent = await parent.getDirectoryHandle(part);
  const handle = await parent.getFileHandle(parts.at(-1));
  const file = await handle.getFile();
  if (file.size > 20 * 1024 * 1024) throw new Error('图片超过 20 MB');
  return file;
}

function directoryImageError(error) {
  if (error.name === 'NotFoundError') return '图片文件不存在，请检查相对路径';
  if (error.name === 'NotAllowedError' || error.name === 'SecurityError') return '图片目录读取权限已失效，请点击右上角「图片目录」重新授权';
  return error.message || '图片读取失败，请重新选择图片目录';
}

// Blob URLs belong only to the active document and are never serialized to Markdown.
class DirectoryImageLoader {
  constructor({ createURL = file => URL.createObjectURL(file), revokeURL = url => URL.revokeObjectURL(url) } = {}) {
    this.createURL = createURL; this.revokeURL = revokeURL; this.context = null;
  }

  clear() {
    const context = this.context;
    this.context = null;
    if (context) for (const resource of context.resources.values()) if (resource.url) this.revokeURL(resource.url);
  }

  fail(image, message) {
    image.onload = null; image.onerror = null;
    image.removeAttribute('src');
    image.classList.add('local-image-error');
    image.alt = `${message}：${image.getAttribute('data-image-path')}`;
    image.title = image.alt;
  }

  async refresh(editor, docId, fileHandle, directory) {
    if (!this.context || this.context.editor !== editor || this.context.docId !== docId || this.context.fileHandle !== fileHandle || this.context.directory !== directory) {
      this.clear();
      this.context = { editor, docId, fileHandle, directory, resources: new Map(), validation: null, images: [] };
    }
    const context = this.context;
    const images = [...editor.querySelectorAll('img[data-image-path]')];
    context.images = images;
    const paths = new Set(images.map(image => image.getAttribute('data-image-path')));
    for (const [path, resource] of context.resources) if (!paths.has(path)) {
      context.resources.delete(path);
      if (resource.url) this.revokeURL(resource.url);
    }
    const current = () => this.context === context;
    const failAll = message => { if (current()) for (const image of context.images) this.fail(image, message); };
    if (!directory) {
      failAll('请点击右上角「图片目录」，授权 Markdown 所在文件夹以显示图片');
      return { permission: 'prompt' };
    }
    try {
      const permission = await directory.queryPermission({ mode: 'read' });
      if (!current()) return null;
      if (permission !== 'granted') {
        // Permission checks are passive: background refresh never opens an authorization prompt.
        for (const resource of context.resources.values()) if (resource.url) this.revokeURL(resource.url);
        context.resources.clear();
        failAll('图片目录读取权限已失效，请点击右上角「图片目录」重新授权');
        return { permission };
      }
      context.validation ||= validateImageDirectory(directory, fileHandle);
      await context.validation;
      if (!current()) return null;
      const jobs = context.images.map(async image => {
        const path = image.getAttribute('data-image-path');
        let resource = context.resources.get(path);
        if (!resource) {
          resource = { url: null, error: null };
          context.resources.set(path, resource);
          resource.pending = readDirectoryImage(directory, path).then(file => {
            if (!current() || context.resources.get(path) !== resource) return;
            resource.url = this.createURL(file);
          }).catch(error => { resource.error = directoryImageError(error); });
        }
        await resource.pending;
        if (!current() || context.resources.get(path) !== resource || !context.images.includes(image)) return;
        if (resource.error) { this.fail(image, resource.error); return; }
        if (!resource.url || image.getAttribute('src') === resource.url) return;
        const originalAlt = image.getAttribute('data-image-alt') || '';
        image.onload = () => {
          if (current() && image.getAttribute('src') === resource.url) {
            image.classList.remove('local-image-error'); image.alt = originalAlt; image.title = path;
          }
        };
        image.onerror = () => {
          if (current() && image.getAttribute('src') === resource.url) this.fail(image, '图片内容无法解码，请检查文件完整性');
        };
        image.classList.remove('local-image-error'); image.alt = originalAlt; image.title = path;
        image.setAttribute('src', resource.url);
      });
      await Promise.all(jobs);
      return current() ? { permission: 'granted', name: directory.name } : null;
    } catch (error) {
      failAll(directoryImageError(error));
      return current() ? { permission: 'error', error: directoryImageError(error) } : null;
    }
  }
}

function save(immediate = false) {
  clearTimeout(saveTimer);
  const perform = () => {
    // A different page's clean disk snapshot must never erase this page's
    // unsaved draft backup when the user refreshes it.
    try { sessionStorage.setItem(PAGE_DRAFT_STORAGE_KEY, JSON.stringify(documents.filter(doc =>
      (doc.fileDirty && (!historyStore || historyStore.ownsDraft(doc))) || fileWriteCounts.get(doc.id)))); }

    try {
      if (historyStore) applySharedHistory(historyStore.publish(documents));

      storageAvailable = true;
    } catch { storageAvailable = false; }

  };

}

function applySharedHistory(records) {
  const local = new Map(documents.map(doc => [doc.id, doc]));
  const protectedRecord = doc => doc.id === activeId || (doc.fileDirty && historyStore.ownsDraft(doc)) || fileWriteCounts.get(doc.id)
    || openingHistoryId === doc.id || authorizingImageDirectories.has(doc.id) || historyStore.hasLocalChanges(doc);
  sharedHistoryRecords = records;
  documents = records.map(record => {
    const existing = local.get(record.id);
    if (existing && protectedRecord(existing)) return existing;
    historyStore.remember(record);
    return record;
  });
  const visible = new Set(records.map(doc => doc.id));
  for (const doc of local.values()) {
    // History deletion never closes another page's editor or discards its
    // pending save. Keep its working copy, but exclude it from the sidebar
    // and from future shared-history writes through the durable tombstone.
    if (!visible.has(doc.id) && protectedRecord(doc)) documents.push(doc);
  }
  renderDocumentList();
  void restoreSharedHistoryHandles(records);
}

const restoringHistoryHandles = new Set();
async function restoreSharedHistoryHandles(records) {
  await Promise.all(records.map(async doc => {
    if (fileHandles.has(doc.id) || restoringHistoryHandles.has(doc.id)) return;
    restoringHistoryHandles.add(doc.id);
    try {
      const [handle, directory] = await Promise.all([recallFileHandle(doc.id), recallFileHandle(imageDirectoryKey(doc.id))]);
      if (!documents.some(item => item.id === doc.id)) return;
      if (handle) fileHandles.set(doc.id, handle);
      if (directory) imageDirectories.set(doc.id, directory);
    } catch { /* Opening the record can retry the IndexedDB lookup. */ }
    finally { restoringHistoryHandles.delete(doc.id); }
  }));
}

function syncSharedHistory(force = false) {
  if (!historyStore) return;
  try {
    if (force || historyStore.hasChanges()) applySharedHistory(historyStore.read());
  } catch { storageAvailable = false; renderFileSaveState(); }
}

function renderFileSaveState() {

    else if (state?.historyReadError) { label = '未读取原文件'; detail = state.error; }
    else if (state?.conflict) { label = '外部修改冲突'; detail = state.historyReadOnly ? '原文件与网页都有修改；点击这里重新授权后核对两份内容' : '原文件与网页都有修改，自动保存已暂停；点击这里核对两份内容'; }
    else if (state?.historyReadOnly) { label = '原文件只读'; detail = state.error; }
    else if (state?.error) { label = '原文件未保存'; detail = state.error; }
    else if (fileWriteCounts.get(doc.id)) { label = '正在写入原文件…'; detail = '等待文件写入完成，请勿关闭页面'; }
    else if (fileSaveTimers.has(doc.id) || doc.fileDirty) { label = '修改尚未写回'; detail = fileWriters.has(doc.id) ? '即将自动写回原文件' : '点击此处重新授权，才能保存回原始文件'; }
    else if (fileWriters.has(doc.id)) { label = '已保存到原文件'; detail = '修改会在停止输入 0.45 秒后自动写回原文件'; }
    else { label = '需要文件授权'; detail = '历史记录是浏览器草稿；点击此处授权原文件后才能编辑和写回'; }
  }
  $('#save-state').textContent = label;
  $('#save-state').title = detail;
  $('#save-state').disabled = !doc;
  $('#sync-status').textContent = detail + (!storageAvailable ? '（浏览器草稿备份不可用）' : '');
  $('#save-state').classList.toggle('file-save-error', !!state?.error || !!state?.conflict || !!doc?.fileDirty);
}

function refreshDocumentImages() {
  const doc = current();

async function authorizeImageDirectory() {
  const doc = current();
  const fileHandle = fileHandles.get(doc?.id);
  if (!doc || authorizingImageDirectories.has(doc.id) || fileHandle?.type === 'moye-local-file') return;
  if (!fileHandle) { toast('请先通过「打开文档」选择原始 Markdown 文件，再授权图片目录'); return; }
  if (!window.showDirectoryPicker) { toast('当前浏览器不支持目录授权，请使用 Chrome 或 Edge，或用 moye 命令打开文档'); return; }
  authorizingImageDirectories.add(doc.id);
  $('[data-action="image-directory"]').disabled = true;
  try {
    const saved = imageDirectories.get(doc.id);
    const permission = imageDirectoryStates.get(doc.id)?.permission;
    let directory;
    // Request a remembered directory's permission directly inside the click gesture.
    if (saved && !['granted', 'error'].includes(permission)) {
      if (await saved.requestPermission({ mode: 'read' }) !== 'granted') throw new Error('未获得图片目录读取授权；Markdown 文件的编辑与保存不受影响');
      directory = saved;
    } else {
      directory = await window.showDirectoryPicker({ id: 'moye-image-directory', mode: 'read', startIn: saved || fileHandle });
    }
    await validateImageDirectory(directory, fileHandle);
    if (!documents.includes(doc) || fileHandles.get(doc.id) !== fileHandle) return;
    imageDirectories.set(doc.id, directory);
    imageDirectoryStates.set(doc.id, { permission: 'granted', name: directory.name });
    let remembered = true;
    try { await rememberFileHandle(imageDirectoryKey(doc.id), directory); }
    catch { remembered = false; }
    if (!documents.includes(doc)) return;
    if (activeId === doc.id) { directoryImageLoader.clear(); refreshDocumentImages(); }
    toast(remembered ? `已关联图片目录：${directory.name}（只读）` : '图片目录已授权，但浏览器未能记住关联；下次打开可能需要重新选择');
  } catch (error) {
    if (error.name !== 'AbortError') toast(error.message || '图片目录授权失败，请重试');
  } finally {
    authorizingImageDirectories.delete(doc.id);
    if (activeId === doc.id) refreshDocumentImages();
  }
}

function scheduleOriginalSave(doc) {
  doc.fileDirty = true;
  if (fileSaveStates.get(doc.id)?.conflict) { renderFileSaveState(); return; }
  fileSaveStates.delete(doc.id);
  clearTimeout(fileSaveTimers.get(doc.id));
  fileSaveTimers.set(doc.id, setTimeout(() => { void flushOriginalFile(doc); }, 450));
  renderFileSaveState();
}

async function flushOriginalFile(doc) {
  clearTimeout(fileSaveTimers.get(doc.id));
  fileSaveTimers.delete(doc.id);
  if (openingHistoryId === doc.id) return false;
  if (fileSaveStates.get(doc.id)?.conflict) { renderFileSaveState(); return false; }
  if (!doc.fileDirty) { renderFileSaveState(); return true; }
  const writer = fileWriters.get(doc.id);
  if (!writer) {
    fileSaveStates.set(doc.id, { error: '尚未授权原始文件，无法写回；请点击保存状态重新授权' });
    renderFileSaveState(); return false;
  }
  const snapshot = doc.markdown;
  fileWriteCounts.set(doc.id, (fileWriteCounts.get(doc.id) || 0) + 1);
  renderFileSaveState();
  try {
    await writer.save(snapshot);
    doc.fileDiskContent = writer.diskContent;
    doc.fileDirty = doc.markdown !== snapshot;
    fileSaveStates.delete(doc.id);
    return true;
  } catch (error) {
    doc.fileDirty = true;
    if (isMissingOriginalFile(error)) setOriginalFileMissing(doc, true);
    if (error.code === 'EXTERNAL_MODIFICATION') {
      clearTimeout(fileSaveTimers.get(doc.id)); fileSaveTimers.delete(doc.id);
      fileSaveStates.set(doc.id, { conflict: true, external: error.externalContent });
    } else fileSaveStates.set(doc.id, { error: error.message || '原文件写入失败，请检查权限后重试' });
    return false;
  } finally {
    fileWriteCounts.set(doc.id, Math.max(0, (fileWriteCounts.get(doc.id) || 1) - 1));
    save(true);
  }
}

async function authorizeOriginalFile() {
  const doc = current();
  if (!doc) return;
  if (openingHistoryId === doc.id) return;
  if (fileSaveStates.get(doc.id)?.historyReadError || fileSaveStates.get(doc.id)?.historyReadOnly) return openHistoryDocument(doc.id);
  if (fileSaveStates.get(doc.id)?.conflict) { showFileConflict(doc); return; }
  const handle = fileHandles.get(doc.id);
  if (!handle) {
    toast('请通过「打开文档」重新选择原始文件以建立读写关联');
    return;
  }
  try {
    // Call from the user's click, before unrelated asynchronous work.
    if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') throw new Error('未获得读写授权，原文件不会被修改');
    if (!fileWriters.has(doc.id)) {
      const disk = await (await handle.getFile()).text();
      if (!hasUnsavedFileChanges(doc) || doc.markdown === disk.replace(/^\uFEFF/, '')) doc.fileDirty = false;
      if (doc.fileDirty && doc.fileDiskContent !== disk) throw new Error('原文件已改变，无法自动合并草稿；请先复制草稿，再重新打开原文件');
      if (!doc.fileDirty) {
        doc.markdown = disk.replace(/^\uFEFF/, '');
        histories.delete(doc.id);
      }
      fileWriters.set(doc.id, new OriginalFileWriter(handle, disk));
      doc.fileDiskContent = disk;
      fileSaveStates.delete(doc.id);
      if (activeId === doc.id) loadDocument(doc.id);
    }
    const ok = await flushOriginalFile(doc);
    if (ok) toast('原始文件已连接，修改将自动写回');
  } catch (error) {
    fileSaveStates.set(doc.id, { error: error.message }); renderFileSaveState();
  }
}

function applyExternalContent(doc, writer, disk, modified) {
  if (activeId === doc.id) tableTools.reset();
  const visible = activeId === doc.id;
  const scroll = visible ? { sourceTop: source.scrollTop, sourceLeft: source.scrollLeft, previewTop: $('.preview-scroll').scrollTop, previewLeft: $('.preview-scroll').scrollLeft, start: source.selectionStart, end: source.selectionEnd } : null;
  let caret = null;
  const selection = window.getSelection();
  if (visible && selection?.rangeCount && visual.contains(selection.anchorNode)) {
    const range = selection.getRangeAt(0);
    const before = document.createRange();
    before.selectNodeContents(visual); before.setEnd(range.startContainer, range.startOffset);
    caret = { start: before.toString().length, length: range.toString().length };
  }
  doc.markdown = disk.replace(/^\uFEFF/, '');
  doc.fileDiskContent = disk;
  doc.fileDirty = false;
  doc.updated = Number.isFinite(modified) ? modified : Date.now();
  writer.diskContent = disk;
  writer.bom = disk.startsWith('\uFEFF') ? '\uFEFF' : '';
  histories.delete(doc.id);
  fileSaveStates.delete(doc.id);
  if (visible) {
    savedRange = null; lastEditKind = null;
    source.value = doc.markdown;
    source.setSelectionRange(Math.min(scroll.start, source.value.length), Math.min(scroll.end, source.value.length));
    visual.innerHTML = renderMarkdown(doc.markdown);
    updateStats(); updateHistoryButtons(); updateFileEditability();
    if (caret) {
      const walker = document.createTreeWalker(visual, NodeFilter.SHOW_TEXT);
      const nodes = []; let total = 0;
      while (walker.nextNode()) { const node = walker.currentNode; nodes.push({ node, start: total }); total += node.textContent.length; }
      const position = offset => {
        offset = Math.min(offset, total);
        const entry = nodes.find(item => offset <= item.start + item.node.textContent.length) || nodes.at(-1);
        return entry ? [entry.node, offset - entry.start] : [visual, 0];
      };
      const range = document.createRange();
      range.setStart(...position(caret.start)); range.setEnd(...position(caret.start + caret.length));
      selection.removeAllRanges(); selection.addRange(range); savedRange = range.cloneRange();
    }
    source.scrollTop = scroll.sourceTop; source.scrollLeft = scroll.sourceLeft;
    $('.line-numbers').style.transform = `translateY(-${source.scrollTop}px)`;
    $('.preview-scroll').scrollTop = scroll.previewTop; $('.preview-scroll').scrollLeft = scroll.previewLeft;
  }
  renderDocumentList(); save(true);
}

async function checkExternalModification() {
  const doc = current();
  if (!doc || document.hidden || composingDocument || resizingTable || deletingRecords.has(doc.id) || externalChecks.has(doc.id) || fileWriteCounts.get(doc.id) || openingHistoryId === doc.id) return;
  const writer = fileWriters.get(doc.id);
  if (!writer) return;
  externalChecks.add(doc.id);
  const baseline = writer.diskContent;
  try {
    const external = await writer.inspectExternal();
    if (activeId !== doc.id || !documents.includes(doc) || fileWriters.get(doc.id) !== writer || fileWriteCounts.get(doc.id) || writer.diskContent !== baseline || composingDocument || resizingTable || deletingRecords.has(doc.id) || openingHistoryId === doc.id) return;
    setOriginalFileMissing(doc, false);
    const unsaved = hasUnsavedFileChanges(doc, baseline);
    const matchesDisk = doc.markdown === external.content.replace(/^\uFEFF/, '');
    if ((!unsaved || matchesDisk) && (external.content !== baseline || doc.fileDirty || fileSaveStates.get(doc.id)?.conflict)) {
      clearTimeout(fileSaveTimers.get(doc.id)); fileSaveTimers.delete(doc.id);
      applyExternalContent(doc, writer, external.content, external.modified);
      if (external.content !== baseline) toast('原文件有外部修改，已自动刷新');
      return;
    }
    if (external.content === baseline) {
      if (fileSaveStates.get(doc.id)?.watchError) { fileSaveStates.delete(doc.id); renderFileSaveState(); }
      return;
    }
    if (unsaved) {
      const first = !fileSaveStates.get(doc.id)?.conflict;
      clearTimeout(fileSaveTimers.get(doc.id)); fileSaveTimers.delete(doc.id);
      fileSaveStates.set(doc.id, { conflict: true, external: external.content });
      renderFileSaveState(); save(true);
      if (first) toast('检测到外部修改：已暂停自动保存，点击保存状态核对冲突');
      return;
    }
    applyExternalContent(doc, writer, external.content, external.modified);
    toast('原文件有外部修改，已自动刷新');
  } catch (error) {
    if (activeId === doc.id && fileWriters.get(doc.id) === writer && isMissingOriginalFile(error)) setOriginalFileMissing(doc, true);
    if (activeId === doc.id && fileWriters.get(doc.id) === writer && !fileSaveStates.get(doc.id)?.conflict) {
      fileSaveStates.set(doc.id, { error: error.message || '暂时无法读取原文件，已保留当前显示内容', watchError: true });
      renderFileSaveState();
    }
  } finally { externalChecks.delete(doc.id); }
}

function showFileConflict(doc) {
  const state = fileSaveStates.get(doc.id);
  if (!state?.conflict) return;
  conflictReview = { id: doc.id, draft: doc.markdown, writer: fileWriters.get(doc.id) };
  showModal(`${modalHeader('原文件与网页都有修改', '自动保存已暂停，两份内容均未被覆盖')}<div class="conflict-versions"><label>网页未保存的修改<textarea id="conflict-draft" readonly aria-label="网页草稿"></textarea></label><label>检测到的磁盘内容<textarea id="conflict-disk" readonly aria-label="磁盘内容"></textarea></label></div><p class="help-notice">可先复制网页草稿另行保留。选择「采用原文件内容」会放弃当前网页草稿，并重新读取原文件。关闭窗口可继续保留草稿，自动保存仍暂停。</p><div class="modal-actions"><button class="secondary-button" data-action="close-modal">保留网页草稿</button><button class="primary-button" data-action="use-disk-version">采用原文件内容</button></div>`, () => {
    $('#conflict-draft').value = doc.markdown;
    $('#conflict-disk').value = state.external.replace(/^\uFEFF/, '');
  });
}

async function useDiskVersion() {
  const review = conflictReview;
  const doc = current();
  if (!review || !doc || doc.id !== review.id || fileWriters.get(doc.id) !== review.writer) return;
  try {
    const external = await review.writer.inspectExternal();
    if (activeId !== review.id || !documents.includes(doc) || fileWriters.get(doc.id) !== review.writer) return;
    if (doc.markdown !== review.draft || fileWriteCounts.get(doc.id)) { showFileConflict(doc); toast('网页草稿有变化，请重新核对'); return; }
    clearTimeout(fileSaveTimers.get(doc.id)); fileSaveTimers.delete(doc.id);
    applyExternalContent(doc, review.writer, external.content, external.modified);
    $('#modal').close(); conflictReview = null;
    toast('已重新读取原文件');
  } catch (error) { toast(error.message || '读取原文件失败，草稿已保留'); }
}

async function openOriginalFile() {
  if (!window.showOpenFilePicker) {
    showModal(`${modalHeader('此浏览器不支持直接写回原文件')}<div class="help-intro">请使用当前版本的 Chrome 或 Edge 打开墨页，再点击「打开文档」并允许文件读写。当前浏览器不会退回只保存缓存的方式。</div><button class="primary-button" data-action="close-modal">知道了</button>`);
    return;
  }
  try {
    const pickerOptions = {
      id: 'inkwell-open-document',
      multiple: false,
      types: [{ description: 'Markdown 文档', accept: { 'text/plain': ['.md', '.markdown', '.txt'] } }],
    };
    if (lastOpenedHandle) pickerOptions.startIn = lastOpenedHandle;
    const [handle] = await window.showOpenFilePicker(pickerOptions);
    lastOpenedHandle = handle;
    void rememberFileHandle(LAST_OPENED_HANDLE_KEY, handle).catch(() => {});
    if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') throw new Error('未获得文件写入授权，文件尚未打开');
    const file = await handle.getFile();
    if (file.size > 2 * 1024 * 1024) throw new Error('请选择小于 2 MB 的 Markdown 文档');
    const disk = await file.text();
    await handleRestore;
    let doc;
    for (const candidate of documents) {
      if (historyStore?.isDeleted(candidate.id)) continue;
      const oldHandle = fileHandles.get(candidate.id);
      if (oldHandle && oldHandle.type !== 'moye-local-file' && await handle.isSameEntry(oldHandle)) { doc = candidate; break; }
    }
    if (!doc) {
      const clean = disk.replace(/^\uFEFF/, '');
      // Cache-only documents from previous versions must not overwrite a file on open.
      doc = { id: crypto.randomUUID(), title: file.name.replace(/\.(md|markdown|txt)$/i, ''), extension: file.name.match(/\.(md|markdown|txt)$/i)?.[0] || '.md', sourcePath: file.name, markdown: clean, updated: Date.now() };
      documents.unshift(doc);
    }
    doc.fileMissing = false;
    if (!hasUnsavedFileChanges(doc) || doc.markdown === disk.replace(/^\uFEFF/, '')) doc.fileDirty = false;
    if (!doc.fileDirty) { doc.markdown = disk.replace(/^\uFEFF/, ''); histories.delete(doc.id); }
    const baseline = doc.fileDirty ? doc.fileDiskContent : disk;
    fileHandles.set(doc.id, handle);
    fileWriters.set(doc.id, new OriginalFileWriter(handle, baseline ?? disk));
    if (!doc.fileDirty) doc.fileDiskContent = disk;
    try { await rememberFileHandle(doc.id, handle); } catch { toast('文件已连接；下次重新打开页面可能需要再次选择文件'); }
    loadDocument(doc.id);
    fileSaveStates.delete(doc.id);
    if (doc.fileDirty) {
      // Retained unsaved changes are never written just by opening a file.
      fileSaveStates.set(doc.id, { error: '已恢复未写回草稿；核对内容后按 ⌘ / Ctrl + S 保存到原文件' });
    }
    renderFileSaveState();
  } catch (error) {
    if (error.name !== 'AbortError') toast(error.message || '文件打开失败');
  }
}

function relativeTime(time) {
  const minutes = Math.floor((Date.now() - time) / 60000);
  if (minutes < 1) return '刚刚编辑';
  if (minutes < 60) return `${minutes} 分钟前`;
  if (minutes < 1440) return `${Math.floor(minutes / 60)} 小时前`;
  return `${Math.floor(minutes / 1440)} 天前`;
}

function setOriginalFileMissing(doc, missing) {
  if (!documents.includes(doc) || !!doc.fileMissing === missing) return;
  doc.fileMissing = missing;
  save(true);
  renderDocumentList();
}

let checkingHistoryAvailability = false;
async function checkHistoryFileAvailability() {
  if (document.hidden || checkingHistoryAvailability) return;
  checkingHistoryAvailability = true;
  try {
    await handleRestore;
    for (const id of documents.map(doc => doc.id)) {
      if (document.hidden) break;
      const doc = documents.find(doc => doc.id === id);
      if (!doc) continue;
      const handle = fileHandles.get(doc.id);
      // Native getFile checks existence without reading the Markdown body.
      // Never prompt for permission as part of a background history check.
      if (!handle || handle.type === 'moye-local-file' || deletingRecords.has(doc.id) || fileWriteCounts.get(doc.id)) continue;
      const valid = () => documents.includes(doc) && fileHandles.get(doc.id) === handle && !deletingRecords.has(doc.id) && !fileWriteCounts.get(doc.id);
      try {
        if (await handle.queryPermission({ mode: 'read' }) !== 'granted' || !valid()) continue;
        await handle.getFile();
        if (valid()) setOriginalFileMissing(doc, false);
      } catch (error) {
        if (valid() && isMissingOriginalFile(error)) setOriginalFileMissing(doc, true);
      }
    }
  } finally { checkingHistoryAvailability = false; }
}

function renderDocumentList() {
  const records = sharedHistoryRecords || documents;
  $('#history-count').textContent = `${records.length} / ${HISTORY_LIMIT}`;
  $('#document-list').innerHTML = records.length ? records.map(doc => `<div class="doc-row ${doc.id === activeId ? 'selected' : ''} ${doc.fileMissing ? 'file-missing' : ''}"><button class="doc-select" data-document="${escapeHTML(doc.id)}" title="${escapeHTML((doc.title || '未命名文档') + (doc.fileMissing ? '（原文件不存在，可能已删除或移动）' : ''))}">${icon('file', 16)}<span>${escapeHTML(doc.title || '未命名文档')}</span></button><button class="icon-button history-delete" data-delete-history="${escapeHTML(doc.id)}" aria-label="删除历史记录：${escapeHTML(doc.title || '未命名文档')}" title="删除历史记录，不删除原文件" ${deletingRecords.has(doc.id) ? 'disabled' : ''}>${icon('trash', 14)}</button></div>`).join('') : '<p class="list-empty">暂无历史记录<br>打开文档后自动保留，最多 20 条。</p>';
}

async function deleteHistoryRecord(id) {
  const doc = documents.find(item => item.id === id);
  if (!doc || deletingRecords.has(id)) return;
  deletingRecords.add(id);
  renderDocumentList();
  try {
    await handleRestore;
    if (doc.fileDirty || fileWriteCounts.get(id)) {
      if (!await flushOriginalFile(doc) || doc.fileDirty || fileWriteCounts.get(id)) {
        toast('修改尚未保存到原文件，已保留这条记录');
        return;
      }
    }
    try { await forgetFileHandle(id); }
    catch {
      if (fileHandles.has(id)) { toast('文件关联清理失败，已保留记录，请重试'); return; }
    }
    if (doc.fileDirty || fileWriteCounts.get(id)) { toast('文档有新的未保存修改，已保留记录'); return; }
    try { historyStore?.delete(id); }
    catch {
      const handle = fileHandles.get(id);
      if (handle) await rememberFileHandle(id, handle).catch(() => {});
      toast('历史删除状态保存失败，已保留记录，请重试'); return;
    }
    clearTimeout(fileSaveTimers.get(id));
    fileSaveTimers.delete(id);
    documents = documents.filter(item => item.id !== id);
    for (const map of [histories, fileHandles, fileWriters, fileSaveStates, fileWriteCounts, imageDirectories, imageDirectoryStates]) map.delete(id);
    if (activeId === id) {
      if (documents[0]) void openHistoryDocument(documents[0].id);
      else loadDocument(null);
    }
    else renderDocumentList();
    save(true);
    toast('已删除历史记录，原始文件未删除');
  } finally {
    deletingRecords.delete(id);
    renderDocumentList();
  }
}

function updateNumbers() {
  const lineCount = source.value.split('\n').length;
  $('.line-numbers').innerHTML = Array.from({ length: lineCount }, (_, i) => `<div>${i + 1}</div>`).join('');
  $('.line-numbers').style.transform = `translateY(-${source.scrollTop}px)`;
  $('#status-lines').textContent = `${lineCount} 行`;
  cursorPosition();
}

function updateStats() {
  refreshCodeCopyButtons(visual, toast);
  refreshDocumentImages();
  const text = visual.textContent || '';
  const chinese = (text.match(/[\p{Script=Han}]/gu) || []).length;
  const other = (text.replace(/[\p{Script=Han}]/gu, ' ').match(/[\p{L}\p{N}]+/gu) || []).length;
  const count = chinese + other;
  $('#heading-words').textContent = `${count} 字`;
  $('#status-words').textContent = `${count} 字`;
  $('#updated-label').textContent = relativeTime(current()?.updated || Date.now());
  updateNumbers();
  updateOutline();
  updateFileEditability();
}

function updateOutline() {
  const headings = [...visual.querySelectorAll('h1,h2,h3,h4,h5,h6')];
  $('#outline-count').textContent = headings.length;
  $('#outline-list').innerHTML = headings.length ? headings.map((h, i) => {
    h.id = `heading-${i}`;
    return `<button data-outline="${i}" class="outline-item ${mode === 'source' && i === 0 ? 'current' : ''}" style="--level:${Number(h.tagName[1]) - 1}"><span>${escapeHTML(h.textContent || '未命名标题')}</span></button>`;
  }).join('') : '<p class="outline-empty">添加标题后<br>在这里快速导航</p>';
  outlineTracking.refresh();
}

function setMode(value) {
  tableTools.reset();
  mode = value === 'source' ? 'source' : 'visual';
  $('.editing-area').dataset.mode = mode;
  const displayButton = $('[data-action="display-mode"]');
  displayButton.querySelector('span').textContent = mode === 'source' ? '源码' : '渲染';
  displayButton.title = `当前：${mode === 'source' ? '源码' : '渲染'}；点击切换为${mode === 'source' ? '渲染' : '源码'}`;
  displayButton.setAttribute('aria-label', displayButton.title);
  save();
}

function historyForDoc() {
  if (!current()) return null;
  if (!histories.has(activeId)) histories.set(activeId, { entries: [current().markdown], index: 0 });
  return histories.get(activeId);
}

function recordHistory(kind) {
  const history = historyForDoc();
  const value = current().markdown;
  if (history.entries[history.index] === value) return;
  const now = Date.now();
  const coalesce = lastEditKind === kind && now - lastEditTime < 700 && history.index > 0 && history.index === history.entries.length - 1;
  history.entries.splice(history.index + 1);
  if (coalesce) history.entries[history.index] = value;
  else { history.entries.push(value); history.index++; }
  if (history.entries.length > 150) { history.entries.shift(); history.index--; }
  lastEditTime = now;
  lastEditKind = kind;
  updateHistoryButtons();
}

function updateHistoryButtons() {
  const history = historyForDoc();
  $('[data-action="undo"]').disabled = !canEditDocument() || !history || history.index === 0;
  $('[data-action="redo"]').disabled = !canEditDocument() || !history || history.index === history.entries.length - 1;
}

function applyHistory(direction) {
  if (!canEditDocument()) return;
  tableTools.reset();
  const history = historyForDoc();
  if (!history) return;
  const next = history.index + direction;
  if (next < 0 || next >= history.entries.length) return;
  history.index = next;
  lastEditKind = null;
  current().markdown = history.entries[history.index];
  source.value = current().markdown;
  visual.innerHTML = renderMarkdown(current().markdown);
  savedRange = null;
  current().updated = Date.now();
  documents = recentDocuments(documents, doc => doc.id === activeId || doc.fileDirty || fileWriteCounts.get(doc.id));
  renderDocumentList();
  scheduleOriginalSave(current());
  updateStats(); updateHistoryButtons(); save();
}

function updatePageTitle() {
  const name = current()?.title.trim();
  document.title = name ? (/\.(md|markdown|txt)$/i.test(name) ? name : name + (current().extension || '.md')) : '墨页 · Markdown 工作空间';
  title.textContent = name || '';
  title.title = current()?.sourcePath || document.title;
}


async function openCommandLineDocument() {
  const version = historyOpenVersion;
  try {
    const handle = await localFileFromHash(window.location.hash);
    if (!handle) return;
    await handleRestore;
    // A user's explicit document selection takes precedence over a slow startup read.
    if (historyOpenVersion !== version) return;
    let doc = documents.find(item => item.localFilePath === handle.path);
    if (doc && historyStore?.isDeleted(doc.id)) doc = null;
    if (!doc) {
      const originalId = `local-${handle.id}`;
      const id = historyStore?.isDeleted(originalId) ? `${originalId}-${crypto.randomUUID()}` : originalId;
      doc = { id, title: handle.name.replace(/\.(md|markdown|txt)$/i, ''), extension: handle.name.match(/\.(md|markdown|txt)$/i)?.[0] || '.md', sourcePath: handle.path, localFilePath: handle.path, markdown: '', updated: Date.now() };
      documents.unshift(doc);
    }
    doc.sourcePath = handle.path;
    fileHandles.set(doc.id, handle);
    try { await rememberFileHandle(doc.id, handle); } catch { toast('原文件已连接，但浏览器未能记住历史文件关联'); }
    if (historyOpenVersion !== version) return;
    if (!document.body.classList.contains('focus-mode')) actions.focus();
    await openHistoryDocument(doc.id);
  } catch (error) { toast(error.message || '命令行文件打开失败，请在终端重新运行 moye'); }
}

function loadDocument(id, readHistory = false) {
  tableTools.reset();
  editingEnabled = false;
  historyOpenVersion++;
  openingHistoryId = readHistory ? id : null;
  activeId = id;
  const doc = current();
  if (doc) {
    doc.lastOpened = Date.now();
    documents = recentDocuments(documents, doc => doc.id === activeId || doc.fileDirty || fileWriteCounts.get(doc.id));
    const retainedIds = new Set(documents.map(item => item.id));
    for (const historyId of histories.keys()) if (!retainedIds.has(historyId)) histories.delete(historyId);
  }
  savedRange = null;
  lastEditKind = null;
  const empty = !doc;
  $('.empty-state').hidden = !empty;
  ['.sidebar-document-info', '.editor-card'].forEach(s => { $(s).hidden = empty; });
  if (doc) {
    title.textContent = doc.title;
    source.value = doc.markdown;
    visual.innerHTML = renderMarkdown(doc.markdown);
    source.scrollTop = 0;
    $('.preview-scroll').scrollTop = 0;
    updateStats(); updateHistoryButtons();
  }
  updatePageTitle();
  updateFileEditability();
  renderFileSaveState();
  renderDocumentList(); save();
  $('.sidebar').classList.remove('mobile-open');
  if (!doc) refreshDocumentImages();
  void checkExternalModification();
}

async function openHistoryDocument(id) {
  const doc = documents.find(item => item.id === id);
  if (!doc || deletingRecords.has(id)) return;
  clearTimeout(fileSaveTimers.get(id)); fileSaveTimers.delete(id);
  loadDocument(id, true);
  const version = historyOpenVersion;
  const stillCurrent = () => version === historyOpenVersion && activeId === id && documents.includes(doc);
  let permissionPromise;
  let handle = fileHandles.get(id);
  try {
    // Initiate permission while the history click still carries user activation.
    if (handle) permissionPromise = handle.requestPermission({ mode: 'readwrite' });
    else {
      await handleRestore;
      if (!stillCurrent()) return;
      handle = fileHandles.get(id);
      if (!handle) {
        handle = await recallFileHandle(id);
        if (!stillCurrent()) return;
        if (handle) fileHandles.set(id, handle);
      }
      if (!handle) throw new Error('这条历史记录没有原文件关联，当前显示的是旧草稿；请通过「打开文档」重新选择原文件');
      permissionPromise = handle.requestPermission({ mode: 'readwrite' });
    }
    const permission = await permissionPromise;
    if (!stillCurrent()) return;
    const canRead = permission === 'granted' || await handle.queryPermission({ mode: 'read' }) === 'granted';
    if (!stillCurrent()) return;
    if (!canRead) throw new Error('未获得原文件读取权限，当前显示的是旧草稿；点击这里重新授权或使用「打开文档」');
    const previousWriter = fileWriters.get(id);
    // Finish existing writes before taking a fresh disk snapshot.
    if (previousWriter) await previousWriter.pending.catch(() => {});
    if (!stillCurrent()) return;
    const file = await handle.getFile();
    if (file.size > 2 * 1024 * 1024) throw new Error('原文件超过 2 MB，未刷新；当前保留历史草稿');
    const disk = await file.text();
    if (!stillCurrent()) return;
    setOriginalFileMissing(doc, false);
    clearTimeout(fileSaveTimers.get(id)); fileSaveTimers.delete(id);
    const baseline = doc.fileDiskContent ?? previousWriter?.diskContent;
    const unsaved = hasUnsavedFileChanges(doc, baseline) && doc.markdown !== disk.replace(/^\uFEFF/, '');
    const writer = new OriginalFileWriter(handle, unsaved ? baseline ?? disk : disk);
    if (permission === 'granted') fileWriters.set(id, writer);
    else fileWriters.delete(id);
    openingHistoryId = null;
    if (unsaved) {
      // Read from disk, but never discard or silently write a restored draft.
      if (baseline === undefined || disk !== baseline) {
        fileSaveStates.set(id, { conflict: true, external: disk, historyReadOnly: permission !== 'granted' });
        toast('原文件已有修改，已保留网页草稿；点击保存状态对照两份内容');
      } else {
        fileSaveStates.set(id, { historyReadOnly: permission !== 'granted', error: '已读取原文件并恢复未保存草稿；核对后点击保存状态授权写回' });
      }
    } else {
      applyExternalContent(doc, writer, disk, file.lastModified);
      if (permission !== 'granted') fileSaveStates.set(id, { historyReadOnly: true, error: '已读取原文件最新内容，目前只读；点击这里授权写入后再编辑' });
    }

  } catch (error) {
    if (!stillCurrent()) return;

    openingHistoryId = null;
    fileWriters.delete(id);
    fileSaveStates.set(id, { historyReadError: true, error: error.message || '原文件读取失败，当前显示的是历史草稿；请重新打开原文件' });

  } finally {
    if (stillCurrent()) { openingHistoryId = null; updateFileEditability(); updateHistoryButtons(); renderFileSaveState(); }
  }
}

  if (['b', 'i'].includes(key) && [source, visual].includes(document.activeElement)) { event.preventDefault(); format(key === 'b' ? 'bold' : 'italic'); }
  if ((key === 'z' || key === 'y') && [source, visual].includes(document.activeElement)) { event.preventDefault(); applyHistory(event.shiftKey || key === 'y' ? 1 : -1); }
});
$('#modal').addEventListener('click', event => { if (event.target === $('#modal')) { const r = $('#modal').getBoundingClientRect(); if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) $('#modal').close(); } });
window.addEventListener('beforeunload', event => {
  save(true);
  if (documents.some(doc => doc.fileDirty) || [...fileWriteCounts.values()].some(count => count > 0)) {
    event.preventDefault(); event.returnValue = '';
  }
});
handleRestore.then(() => { renderFileSaveState(); refreshDocumentImages(); void checkHistoryFileAvailability(); });
for (const editor of [source, visual]) {
  editor.addEventListener('compositionstart', () => { composingDocument = true; });
  editor.addEventListener('compositionend', () => { composingDocument = false; void checkExternalModification(); });
}
window.addEventListener('storage', event => {
  if (event.key === null || event.key?.startsWith(HISTORY_STORAGE_PREFIX)) syncSharedHistory(true);
});
setInterval(() => { if (!document.hidden) syncSharedHistory(); }, 1000);
setInterval(() => { void checkExternalModification(); }, 1500);
setInterval(() => { void checkHistoryFileAvailability(); }, 15000);
window.addEventListener('focus', () => { syncSharedHistory(true); void checkExternalModification(); void checkHistoryFileAvailability(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { syncSharedHistory(true); void checkExternalModification(); void checkHistoryFileAvailability(); }
});
applyTheme();
applyWidths();
applyFontSize();
loadDocument(activeId);
setMode(mode);
void openCommandLineDocument();

} catch (error) {
console.error(error);
const app = document.getElementById('app');
app.innerHTML = '<section class="startup-message"><h1>墨页未能启动</h1><p>请刷新页面，或使用当前版本 Chrome、Edge、Safari 打开此文件。</p><details><summary>查看错误信息</summary><pre></pre></details></section>';
app.querySelector('pre').textContent = String(error.message || error);
} })();</script>
